name: Build M5Doom Firmware

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Build firmware
      run: |
        pio run -e m5stack-cardputer
    
    - name: Rename firmware
      run: |
        mkdir -p firmware
        cp .pio/build/m5stack-cardputer/firmware.bin firmware/M5Doom-m5cardputer.bin || true
        cp .pio/build/m5stack-cardputer/firmware.elf firmware/M5Doom-m5cardputer.elf || true
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: M5Doom-firmware
        path: firmware/
        retention-days: 30
    
    - name: Create Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          firmware/M5Doom-m5cardputer.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Check code
      run: |
        pio check -e m5stack-cardputer --skip-packages || true
