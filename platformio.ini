[env:m5stack-cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; M5Cardputer specific settings
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_CARDPUTER
    -DDOOMGENERIC_RESX=240
    -DDOOMGENERIC_RESY=135
    -DCMAP256
    -O2
    -ffunction-sections
    -fdata-sections
    -Wno-write-strings

; Libraries
lib_deps = 
    m5stack/M5Cardputer @ ^1.0.0
    m5stack/M5GFX @ ^0.2.0
    m5stack/M5Unified @ ^0.2.0

; Upload settings
monitor_speed = 115200
upload_speed = 921600
